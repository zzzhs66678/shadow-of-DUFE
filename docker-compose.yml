services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_XIAOYING_URL: ${NEXT_PUBLIC_XIAOYING_URL:-/campus-lab/}
    image: dufesh-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WRANGLER_LOG_PATH: /tmp/wrangler.log
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  xiaoying:
    build:
      context: ./xiaoying-executor
      dockerfile: Dockerfile
    image: dufesh-xiaoying:latest
    restart: unless-stopped
    env_file:
      - ${DUFESH_XIAOYING_ENV_FILE:-/srv/apps/dufesh/shared/config/xiaoying.env}
    environment:
      NODE_ENV: production
      XIAOYING_EXECUTOR_HOST: 0.0.0.0
      XIAOYING_EXECUTOR_PORT: "43120"
      XIAOYING_BASE_PATH: /campus-lab
      XIAOYING_PUBLIC_BASE_URL: https://dufesh.cn/campus-lab
      XIAOYING_DATABASE_PATH: /data/xiaoying.sqlite
      XIAOYING_MASTER_KEY_PATH: /data/master-key
      XIAOYING_TRACEINT_PROTOCOL_PATH: /data/traceint-protocol.json
    expose:
      - "43120"
    volumes:
      - xiaoying_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:43120/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 192m
    mem_reservation: 48m
    cpus: 0.50
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${DUFESH_POSTGRES_ENV_FILE:-/srv/apps/dufesh/shared/config/postgres.env}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 128m
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${DUFESH_POSTGRES_ENV_FILE:-/srv/apps/dufesh/shared/config/postgres.env}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./ops/postgres:/opt/dufesh-postgres:ro
    entrypoint: ["/bin/sh", "/opt/dufesh-postgres/run-migrations.sh"]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  auth-api:
    build:
      context: ./services/auth-api
      dockerfile: Dockerfile
    image: dufesh-auth-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${DUFESH_POSTGRES_ENV_FILE:-/srv/apps/dufesh/shared/config/postgres.env}
      - ${DUFESH_AUTH_ENV_FILE:-/srv/apps/dufesh/shared/config/auth.env}
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: "5432"
      AUTH_API_PORT: "3100"
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/api/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: docker.m.daocloud.io/library/caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      xiaoying:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/apps/dufesh/shared/resources/published:/srv/resources:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  xiaoying_data:
