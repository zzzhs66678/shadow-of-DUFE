services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dufesh-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WRANGLER_LOG_PATH: /tmp/wrangler.log
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 768m

  web:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
