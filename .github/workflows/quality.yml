name: quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: postgres-17-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dufesh_ci
          POSTGRES_USER: dufesh_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dufesh_owner -d dufesh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      POSTGRES_DB: dufesh_ci
      POSTGRES_USER: dufesh_owner
      POSTGRES_PASSWORD: ci-owner-password
      AUTH_DB_USER: dufesh_runtime_ci
      AUTH_DB_PASSWORD: ci-runtime-password
      IMPORT_DB_USER: dufesh_import_ci
      IMPORT_DB_PASSWORD: ci-import-password
      POSTGRES_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client and Node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/auth-api --ignore-scripts --no-audit --no-fund
      - name: Apply migrations twice
        run: |
          MIGRATIONS_DIR="$GITHUB_WORKSPACE/ops/postgres/migrations" sh ops/postgres/run-migrations.sh
          MIGRATIONS_DIR="$GITHUB_WORKSPACE/ops/postgres/migrations" sh ops/postgres/run-migrations.sh
      - name: Verify PostgreSQL roles and real auth/community flows
        run: node --test tests/postgres-runtime-integration.test.mjs
      - name: Run isolated backup restore drill
        run: |
          drill_dir="$RUNNER_TEMP/postgres-restore-drill"
          backup_file="$drill_dir/${POSTGRES_DB}-ci.dump"
          env_file="$drill_dir/postgres.env"
          mkdir -p "$drill_dir"
          PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
            --host "$PGHOST" \
            --port "$PGPORT" \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --format custom \
            --compress 9 \
            --no-owner \
            --no-privileges \
            --file "$backup_file"
          (cd "$drill_dir" && sha256sum "$(basename "$backup_file")" > "$(basename "$backup_file").sha256")
          printf 'POSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPGHOST=%s\nPGPORT=%s\n' \
            "$POSTGRES_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$PGHOST" "$PGPORT" > "$env_file"
          chmod 600 "$env_file"
          DUFESH_POSTGRES_ENV_FILE="$env_file" \
            BACKUP_DIR="$drill_dir" \
            RESTORE_DRILL_MODE=native \
            RESTORE_DRILL_MAX_SECONDS=120 \
            sh ops/postgres/restore-drill.sh "$backup_file"
          remaining="$(PGPASSWORD="$POSTGRES_PASSWORD" psql \
            --host "$PGHOST" --port "$PGPORT" \
            --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM pg_database WHERE datname LIKE 'dufesh_restore_drill_%'")"
          test "$remaining" = "0"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install main app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Xiaoying service
        run: npm ci --prefix xiaoying-executor --ignore-scripts --no-audit --no-fund
      - name: Install auth API
        run: npm ci --prefix services/auth-api --ignore-scripts --no-audit --no-fund
      - name: Install browser for accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Check production dependencies
        run: |
          npm audit --omit=dev --omit=optional --audit-level=high
          npm audit --prefix services/auth-api --omit=dev --audit-level=high
          npm audit --prefix xiaoying-executor --omit=dev --audit-level=high
      - name: Run regression tests
        run: |
          node --test tests/course-schedule-logic.test.mjs
          node --test tests/course-core-data.test.mjs
          node --test tests/product-experience.test.mjs
          node --test tests/performance-budget.test.mjs
          node --test tests/infrastructure-contract.test.mjs
          node --test tests/personal-storage.test.ts tests/personal-sync.test.ts
          npm test --prefix services/auth-api
          npm run test:xiaoying
      - name: Build production app
        run: npm run build
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Check rendered HTML
        run: |
          node --test tests/rendered-html.test.mjs
          node --test tests/production-server.test.mjs
      - name: Check browser accessibility and responsive layouts
        run: npm run test:browser

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
